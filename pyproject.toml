[project]
name = "robotic-arm"
version = "0.1.0"
description = "Parametric robotic arm CAD models built with build123d"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "build123d>=0.10,<0.12",
    # Pinned tight: MjSpec is actively churning (3.14.0 shipped 2026-09-22
    # with breaking changes).
    "mujoco>=3.14,<4",
    "numpy>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
# Feature recognition, used only to re-derive actuator geometry from vendor
# STEP files. Not needed at runtime: the result is committed as JSON.
cad = [
    "quiddity>=0.3,<0.4",
]
# Offscreen rendering to GIF/PNG. Not needed to run the sim or the tests.
viz = [
    "pillow>=10",
]
# Policy simulation in learning/: a task scene and a Gymnasium env. CPU only.
sim = [
    "gymnasium>=1.0",
    "pillow>=10",
]
# Learned policies (ACT, ...) run, recorded and trained through LeRobot.
# Pulls in torch; the PyPI wheels on Windows are CPU builds, which is all a
# rollout or a recording needs. Train on a CUDA machine.
policy = [
    "lerobot[dataset,training]>=0.6,<0.7; python_version >= '3.12'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotic_arm"]

[tool.pytest.ini_options]
testpaths = ["tests", "learning/tests"]
# learning/ is a top-level package beside src/, imported from the repo root.
pythonpath = ["."]
